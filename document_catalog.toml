# Document catalog: the decisions a person makes about each document.
#
# file            File name exactly as in the documents folder.
# access_level    "internal" (every employee, interns included) or "restricted" (management and HR).
# status          "active" (current) or "superseded" (another document replaced it). Default: "active".
# effective_date  Date the document took effect, written as 2026-01-01. Leave it out if unknown.
# replaced_by     Only for superseded documents: the file that replaced this one.
#
# A file that is missing here is treated as "restricted" until someone adds it.
# A wrong value stops the program: these labels decide who can see what.

