# CIA evaluation questions (step 12). Numbers 1-26 follow document_guide.md; 27-36 were added in step 12,
# 37-43 in step 15 (look-ups by code, number or name: where keyword search is needed), 44-46 in step 16
# (questions the documents have nothing on) and 47-49 in step 17 (follow-up questions in a conversation).
#
# Fields of a question:
#   id, type, role, question, expected  required. role is a key of ROLES in config.py.
#                                         expected is the answer key the LLM judge compares against:
#                                         what the answer must say, with optional context in (parentheses).
#   answerable    false when the documents (visible to this role) do not contain the answer
#   sources       files that contain the answer; one of them must be retrieved
#   evidence      facts that must appear in the retrieved chunks (the LLM cannot answer without them);
#                 a fact is a phrase, or a list of phrases of which any one proves it: [["a", "b"], "c"]
#   must_include  phrases that must all appear in the answer
#   any_of        phrases of which at least one must appear in the answer
#   must_not      phrases that must not appear in the answer
#   forbidden     phrases that must appear neither in the answer nor in what the LLM was shown (leak test)
#   history       earlier questions of the same conversation, oldest first (the question is rewritten with them)
#   known_gap     a failure we expect (not fixed in this project); shown separately in the report
#   off_topic     true when nothing in the documents is about the question: the search must find nothing,
#                 so that the LLM is not asked at all (step 16). Needs answerable = false.
#
# Phrases ignore case, extra spaces and Markdown bold, and match at the start of a word: "22 gün" matches
# "22 gündür" (Turkish suffixes), but "11" does not match inside "M-1011". Keep them short: one fact each.

# For unanswerable questions without their own any_of: the answer must say the information is missing.
not_found_phrases = [
    "bilgi yok", "bilgi bulunmuyor", "bilgi bulunmamaktadır", "bilgi yer almıyor", "yer almamaktadır",
    "yer almıyor", "içermiyor", "içermemektedir", "belirtilmemiş", "belirtilmemektedir", "bulunamadı",
    "no relevant documents were found",
]

